name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (use macos-latest if macos-26 is unavailable)"
        type: choice
        options:
          - macos-26
          - macos-latest
        default: macos-26

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and bundle Halo.app (Xcode ${{ matrix.xcode }})
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 26.6: the image default. 26.0.1: the first Swift 6.2 toolchain, closest to an
        # older Command Line Tools install, so compiler-version differences show up here.
        xcode: ["26.6", "26.0.1"]
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - name: Check out (with the mediaremote-adapter submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: No SwiftUI macros (Command Line Tools compatibility)
        # On the macOS 27 SDK these SwiftUI attributes are macros whose plugin ships
        # only with Xcode, so a Command Line Tools-only build cannot expand them.
        run: |
          if grep -rnE '^[[:space:]]*(@(State|Entry|Previewable)\b|#Preview\b)' Sources; then
            echo "::error::SwiftUI macros break Command Line Tools builds on the macOS 27 SDK"
            exit 1
          fi

      - name: Unit tests
        run: swift test

      - name: Bundle Halo.app
        run: scripts/bundle.sh

      - name: Inspect bundle
        run: |
          find build/Halo.app -maxdepth 5 -print
          codesign --display --verbose=2 build/Halo.app
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/Halo.app/Contents/Info.plist

      - name: Adapter smoke test (diagnostic only, no media session on CI)
        continue-on-error: true
        run: |
          RES="$PWD/build/Halo.app/Contents/Resources/MediaRemoteAdapter"
          /usr/bin/perl "$RES/mediaremote-adapter.pl" "$RES/MediaRemoteAdapter.framework" get --no-artwork

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/Halo.app build/Halo.zip

      - name: Upload Halo.app
        uses: actions/upload-artifact@v4
        with:
          name: Halo-app-xcode-${{ matrix.xcode }}
          path: build/Halo.zip
          if-no-files-found: error

  sdk27:
    name: Build against the macOS 27 SDK (Xcode 27 preview + Command Line Tools)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          ls -d /Library/Developer/CommandLineTools/SDKs/*.sdk 2>/dev/null || true

      - name: Build with Xcode 27
        run: swift build -c release --product Halo

      - name: Build with the Command Line Tools (if they ship the macOS 27 SDK)
        run: |
          CLT=/Library/Developer/CommandLineTools
          if ls -d "$CLT"/SDKs/MacOSX27*.sdk >/dev/null 2>&1; then
            rm -rf .build
            DEVELOPER_DIR="$CLT" swift --version
            DEVELOPER_DIR="$CLT" swift build -c release --product Halo
          else
            echo "No macOS 27 SDK in the Command Line Tools on this image; skipped."
          fi
